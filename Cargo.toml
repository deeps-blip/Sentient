[package]
name = "sentient"
version = "0.1.0"
edition = "2021"
description = "Sentient - Offline-first, privacy-focused Windows desktop antivirus combining Windows MRT integration with a multithreaded hash scanner and quarantine system."
authors = ["Sentient Security"]

[[bin]]
name = "sentient"
path = "src/main.rs"

[[bin]]
name = "sentient-setup"
path = "src/bin/installer.rs"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
crossbeam-channel = "0.5.15"
walkdir = "2.5.0"
sha2 = "0.11.1"
md-5 = "0.11.0"
hex = "0.4.3"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.35", features = ["serde"] }
rfd = "0.17.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
